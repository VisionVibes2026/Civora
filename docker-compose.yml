version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: civora-backend
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=development
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:///./civora_dev.db
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: civora-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
